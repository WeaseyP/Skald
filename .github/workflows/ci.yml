name: CI

on:
  push:
    branches: [main, dev, review-fixes]
  pull_request:

# The whole project is Windows-first (batch scripts, Squirrel packaging),
# so both jobs run on windows-latest.

jobs:
  backend:
    name: Backend (codegen + acceptance)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the Odin release CI builds against. Local dev is on dev-2025-02;
      # bump this deliberately, alongside a local upgrade, never implicitly.
      - name: Install Odin
        shell: pwsh
        run: |
          $release = "dev-2025-02"
          $url = "https://github.com/odin-lang/Odin/releases/download/$release/odin-windows-amd64-$release.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\odin.zip"
          Expand-Archive "$env:RUNNER_TEMP\odin.zip" -DestinationPath C:\odin-dist
          # The zip may nest the distribution one directory deep.
          $exe = Get-ChildItem C:\odin-dist -Recurse -Filter odin.exe | Select-Object -First 1
          if (-not $exe) { throw "odin.exe not found in release archive" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName

      - name: Odin version
        run: odin version

      - name: Acceptance suite (codegen + FFT assertions, 31 fixtures)
        working-directory: skald-backend
        run: .\run_acceptance.bat

      - name: Golden-file snapshot check (emitted code is text-stable)
        working-directory: skald-backend
        run: .\run_golden.bat check

      # The parameter contract's own unit tests (roadmap packet A8): the range
      # table and the exposed-default resolution, per JSON value type. Six range
      # mismatches are on record and four of them were fixed once and re-found,
      # so the table gets tests of its own rather than only being covered
      # indirectly through emitted goldens.
      - name: Parameter-contract unit tests
        working-directory: skald-backend
        run: odin test tests\unit

      # ---------------------------------------------------------------------
      # Binary provenance (roadmap packet A2 / BUGS.md SKB-001). The audit's
      # most-cited finding was that the binary the app spawns
      # (skald-ui/skald_codegen.exe) was COMMITTED and nine backend commits
      # stale, while CI built its own copy from source and never looked at the
      # committed one: the green badge certified a compiler no user ran.
      #
      # The binary is untracked now, so the job that proves the app works has to
      # build it — by the same path a contributor's `npm start` takes, so that
      # path cannot rot either.
      # ---------------------------------------------------------------------
      - name: Build the code generator the app spawns (the prestart path)
        working-directory: skald-ui
        run: node scripts/ensure-codegen.mjs --required

      # The stamp is a digest of the backend sources embedded in the binary at
      # compile time (skald-backend/main.odin), which the editor compares
      # against the files on disk before spawning it. Its one weakness is that
      # the embedded file list is hand-written, so a NEW backend source would sit
      # outside the digest and drift unwatched. The app only warns about that —
      # refusing would leave a contributor unable to un-stick themselves by
      # rebuilding — so this is where it has to be fatal.
      - name: Provenance stamp covers every backend source
        shell: pwsh
        working-directory: skald-backend
        run: |
          $stamp = & ..\skald-ui\skald_codegen.exe -version
          if ($LASTEXITCODE -ne 0) { throw "skald_codegen.exe -version exited $LASTEXITCODE" }
          $stamp | ForEach-Object { Write-Host "  $_" }
          $digest = $stamp | Select-String '^source-digest: (\S+)$'
          if (-not $digest) { throw "No source-digest line: the binary reports no provenance stamp." }
          $stamped = $stamp |
            Select-String '^source-file: \S+ (.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          $onDisk = @('main.odin') + (Get-ChildItem core -Filter *.odin | ForEach-Object { "core/$($_.Name)" })
          $uncovered = $onDisk | Where-Object { $stamped -notcontains $_ }
          $ghost = $stamped | Where-Object { $onDisk -notcontains $_ }
          if ($uncovered) {
            throw "Backend sources outside the provenance stamp: $($uncovered -join ', '). " +
                  "Add them to CODEGEN_SOURCES in skald-backend/main.odin, or drift in them is invisible."
          }
          if ($ghost) { throw "Stamp names sources that no longer exist: $($ghost -join ', ')." }
          Write-Host "Stamp covers all $($onDisk.Count) backend sources."

      # SKB-020: every checked-in generated_audio.odin was emitted by the stale
      # binary, so all of them re-introduced the voice-steal click that source
      # had already fixed — including the integration demo, which is the copy a
      # game developer starts from. Regenerate and diff, exactly like the
      # goldens.
      - name: Checked-in generated Odin matches the current compiler
        working-directory: skald-backend
        run: .\regen_generated.bat check

      # ...and it has to COMPILE, not just match: three harnesses and the
      # reference integration build against those files.
      - name: Harnesses and the integration demo build against it
        shell: pwsh
        run: |
          odin build skald-backend/tester -out:test_harness.exe
          if ($LASTEXITCODE -ne 0) { throw "tester harness build failed" }
          odin build skald-backend/tester/fixture_player -out:fixture_player.exe
          if ($LASTEXITCODE -ne 0) { throw "fixture_player build failed" }
          Push-Location examples/integration_demo
          odin build . -out:integration_demo.exe
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "integration demo build failed" }
          ./integration_demo.exe -mode:silent-test
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "integration demo silent-test failed" }
          Pop-Location

      # The reappearance gate. Untracking the binary is only a fix while it
      # stays untracked: a single `git add -f` would put a stale compiler back
      # in the index and CI would go on testing its own build instead.
      - name: No build artifact is tracked in git
        shell: pwsh
        run: |
          $tracked = git ls-files -- '*.exe' '*.dll' '*.wasm' '*.obj' '*.pdb'
          if ($tracked) {
            $tracked | ForEach-Object { Write-Host "  tracked artifact: $_" }
            throw "Build artifacts are tracked. skald-ui/skald_codegen.exe was committed and " +
                  "went nine backend commits stale (SKB-001); it is built by prestart/premake now."
          }
          git check-ignore -q skald-ui/skald_codegen.exe
          if ($LASTEXITCODE -ne 0) {
            throw "skald-ui/skald_codegen.exe is no longer gitignored — an un-ignore exception " +
                  "has come back. See the comment at the top of .gitignore."
          }
          Write-Host "No tracked build artifacts; the codegen binary is ignored."

      # The audit's top finding was a working tree nobody could reproduce: the
      # compiler four agents measured against, two source modules imported by
      # shipped code, and the manual the whole audit was calibrated on all
      # existed on one disk only (roadmap §3.2). A build that leaves untracked
      # files behind is how that happens — either a source file was never
      # committed, or a build artifact is landing somewhere that isn't ignored.
      #
      # It fails on modified tracked files too, deliberately.
      #
      # A note here used to say that `build_codegen.bat` trips this step by
      # writing over the tracked skald-ui/skald_codegen.exe. Two things were
      # wrong with that: nothing in this job built the CLI at all, and
      # skald-ui/skald_codegen.exe is outside the pathspec below (which covers
      # skald-ui/src, not skald-ui/) — so it never could have tripped. Packet A2
      # settles it either way: the binary is untracked and matched by
      # `.gitignore`'s `*.exe`, so the steps above now build it, run it, and
      # regenerate every checked-in generated_audio.odin with it, and this step
      # still sees a clean tree. Anything those steps leave behind that is NOT
      # ignored (say skald-backend/.regen/) fails here, which is the point.
      - name: No untracked files after the backend build
        shell: pwsh
        run: |
          $stray = git status --porcelain --untracked-files=all -- docs examples skald-backend skald-ui/src
          if ($stray) {
            Write-Host "Untracked or modified paths after a clean build:"
            $stray | ForEach-Object { Write-Host "  $_" }
            throw "Commit the sources, or add the build artifact to .gitignore."
          }
          Write-Host "Tree clean."

  ui:
    name: UI (lint + typecheck + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skald-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skald-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The UI job needs Odin because the range-parity gate (packet A8) builds
      # and runs the backend's own range dump rather than comparing against a
      # committed copy of it — a committed copy would go stale exactly when
      # someone edits the table without regenerating, which is the failure this
      # repo has already had twice (the tracked codegen binary, the checked-in
      # generated Odin). The gate throws rather than skipping when Odin is
      # absent, so without this step the job fails by design.
      # Same pinned release as the backend job; bump both together.
      - name: Install Odin
        shell: pwsh
        working-directory: .
        run: |
          $release = "dev-2025-02"
          $url = "https://github.com/odin-lang/Odin/releases/download/$release/odin-windows-amd64-$release.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\odin.zip"
          Expand-Archive "$env:RUNNER_TEMP\odin.zip" -DestinationPath C:\odin-dist
          $exe = Get-ChildItem C:\odin-dist -Recurse -Filter odin.exe | Select-Object -First 1
          if (-not $exe) { throw "odin.exe not found in release archive" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Same gate as the backend job; `npm ci` and vitest must leave the source
      # tree exactly as they found it.
      - name: No untracked files after the UI build
        shell: pwsh
        working-directory: .
        run: |
          $stray = git status --porcelain --untracked-files=all -- docs examples skald-backend skald-ui/src
          if ($stray) {
            Write-Host "Untracked or modified paths after a clean build:"
            $stray | ForEach-Object { Write-Host "  $_" }
            throw "Commit the sources, or add the build artifact to .gitignore."
          }
          Write-Host "Tree clean."

  manual:
    name: Manual (chapter registry)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scripts/manual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/manual/package-lock.json

      - run: npm ci

      # PARTS in build-manual.mjs is hand-maintained, and an unregistered
      # chapter used to be skipped silently: 70-space-funk-build.md was written
      # and shipped absent from the compiled manual with a zero exit code. This
      # validates the registry against docs/manual-source/ without rendering
      # (no Chrome needed for the PDF).
      - name: Chapter registry matches docs/manual-source
        run: npm run check
